autoinstall:
  version: 1

  user-data:
    users: [""]
    disable_root: false

  ssh:
    install-server: false

  storage:
    layout:
      name: lvm
      sizing-policy: all   # Subiquity's default ('scaled') leaves a large
                           # portion of the disk unallocated - 'all' uses 100%
      password: Ubuntu   # Must match the LUKS root script below - change before deployment

  # keyboard:
  #   layout: de
  # locale: en_US
  # timezone: Europe/Berlin
  updates: security
  shutdown: reboot

  # Mandatory packages for Intune requirements
  packages:
    - curl
    - gpg
    - dmidecode   # Required for serial number retrieval in hostname script

  late-commands:

    ###########################################################################
    # Start - Hostname setup (LT-L-<serial>) - first pass ─────────────────────
    ###########################################################################
    #
    # Naming convention: LT-L-<BIOS serial number>
    # Fallback:          LT-L-UNKWN-<4 random hex chars> if serial is empty
    #                    (covers VMs or devices with missing BIOS serial)
    #
    # This sets a correct hostname at install time, so the machine has a sane
    # name from the very first boot. gnome-initial-setup's account-creation
    # step (which runs later, on first boot) sets the hostname based on the
    # name typed in during setup, overwriting this value - a second pass
    # inside luks-change-password-root.sh below reasserts the correct
    # hostname after account creation has already happened, so it wins as
    # the final value. Both passes use the same dmidecode-based logic.
    #
    # dmidecode is available in the live installer environment and reads
    # the BIOS/UEFI system serial number directly from hardware.

    - |
      SERIAL=$(dmidecode -s system-serial-number 2>/dev/null | tr -d '[:space:]')

      if [ -z "$SERIAL" ] || [ "$SERIAL" = "ToBeFilledByO.E.M." ] || [ "$SERIAL" = "Default string" ]; then
        RANDOM_SUFFIX=$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 4)
        NEW_HOSTNAME="LT-L-UNKWN-${RANDOM_SUFFIX}"
      else
        NEW_HOSTNAME="LT-L-${SERIAL}"
      fi

      # Write hostname into the target system
      echo "$NEW_HOSTNAME" > /target/etc/hostname

      # Patch /etc/hosts - replace any existing 127.0.1.1 line or add a new one
      if grep -q "127.0.1.1" /target/etc/hosts; then
        sed -i "s/^127\.0\.1\.1.*/127.0.1.1\t${NEW_HOSTNAME}/" /target/etc/hosts
      else
        echo "127.0.1.1\t${NEW_HOSTNAME}" >> /target/etc/hosts
      fi

      # -- Axelera provisioning log ────────────────────────────────────────
      # Single log file that both this install-time script and the later
      # first-boot scripts (LUKS UI/root) write to, so there is one place
      # to check instead of digging through general system/journal logs.
      # Permissions are wide open (666) on purpose: this file only ever
      # contains hostnames/serials/step outcomes, never passwords or
      # secrets, and it needs to be appendable by both root (install time,
      # and the LUKS root script) and the regular user (the LUKS UI script).
      mkdir -p /target/var/log
      touch /target/var/log/axelera-provisioning.log
      chmod 666 /target/var/log/axelera-provisioning.log
      echo "$(date '+%Y-%m-%d %H:%M:%S') [HOSTNAME-PASS1] serial=${SERIAL:-<empty>} hostname_set=${NEW_HOSTNAME}" >> /target/var/log/axelera-provisioning.log

    ###########################################################################
    # End - Hostname setup (pass 1) ────────────────────────────────────────────
    ###########################################################################

    ###########################################################################
    # Start - LUKS first-boot password-change (GUI, post-login) ───────────────
    ###########################################################################
    #
    # Approach: two-script design
    #   luks-change-password-ui.sh   - runs as the logged-in user, shows
    #                                   zenity dialogs, validates input
    #   luks-change-password-root.sh - runs as root via sudo (NOPASSWD),
    #                                   performs the actual cryptsetup call
    #
    # Triggered by /etc/xdg/autostart on first desktop login.
    # Guard file /var/lib/luks-firstboot is removed on success.

    # User-facing UI script
    - |
      cat > /target/usr/local/bin/luks-change-password-ui.sh << 'SCRIPT'
      #!/bin/bash

      LOGFILE="/var/log/axelera-provisioning.log"

      # Exit silently if already completed
      [ ! -f /var/lib/luks-firstboot ] && exit 0

      echo "$(date '+%Y-%m-%d %H:%M:%S') [LUKS-UI] autostart fired, user=$(whoami)" >> "$LOGFILE"

      export DISPLAY="${DISPLAY:-:0}"
      export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=/run/user/$(id -u)/bus}"

      # Opening info dialog - user cannot skip this
      zenity --info \
        --title="Axelera AI - Disk Encryption Setup" \
        --width=420 \
        --text="<b>Axelera AI - Managed Device</b>\n\nYou must set a permanent disk encryption password.\n\nThe installer used a temporary password that must be replaced before this device can be used.\n\nYou cannot skip this step."

      while true; do

        NEW_PASS=$(zenity --password \
          --title="Axelera AI - Set Encryption Password" \
          --text="Enter your new encryption password (minimum 12 characters):")

        # User closed dialog - re-show info and loop, cannot escape
        if [ $? -ne 0 ]; then
          zenity --warning \
            --title="Required" \
            --text="Setting an encryption password is required.\nPlease complete this step."
          continue
        fi

        if [ ${#NEW_PASS} -lt 12 ]; then
          zenity --error \
            --title="Password Too Short" \
            --text="The password must be at least 12 characters.\nPlease try again."
          continue
        fi

        CONFIRM=$(zenity --password \
          --title="Axelera AI - Confirm Encryption Password" \
          --text="Confirm your new encryption password:")

        if [ $? -ne 0 ]; then
          continue
        fi

        if [ "$NEW_PASS" != "$CONFIRM" ]; then
          zenity --error \
            --title="Passwords Do Not Match" \
            --text="The passwords you entered do not match.\nPlease try again."
          continue
        fi

        break
      done

      echo "$(date '+%Y-%m-%d %H:%M:%S') [LUKS-UI] password accepted, handing off to root script" >> "$LOGFILE"

      # Hand off to root script via sudo (NOPASSWD rule, stdin pipe)
      echo "$NEW_PASS" | sudo /usr/local/bin/luks-change-password-root.sh
      RESULT=$?

      echo "$(date '+%Y-%m-%d %H:%M:%S') [LUKS-UI] root script exit_code=${RESULT}" >> "$LOGFILE"

      if [ $RESULT -eq 0 ]; then
        zenity --info \
          --title="Axelera AI - Encryption Password Set" \
          --width=380 \
          --text="<b>Your encryption password has been set successfully.</b>\n\nThis prompt will not appear again."

          gtk-launch intune-portal
      else
        zenity --error \
          --title="Error" \
          --text="Failed to change the encryption password.\nYou will be prompted again on next login."
      fi
      SCRIPT

    - chmod 0755 /target/usr/local/bin/luks-change-password-ui.sh

    # Root script - only called by the UI script via sudo
    - |
      cat > /target/usr/local/bin/luks-change-password-root.sh << 'SCRIPT'
      #!/bin/bash

      LOGFILE="/var/log/axelera-provisioning.log"

      # -- Reassert hostname (LT-L-<serial>) ────────────────────────────────
      # This runs AFTER gnome-initial-setup has already created the account.
      # gnome-initial-setup's account-creation step sets the hostname based
      # on the name typed in during setup, which overwrites whatever the
      # install-time late-commands hostname script set. Since this script
      # runs on first login (after account creation is already done), this
      # is the correct point to reassert the real hostname, so it wins as
      # the last write instead of the one gnome-initial-setup made.
      #
      # hostnamectl is used here (not a raw file edit) since this runs on a
      # live booted system, so it updates the running hostname immediately
      # in addition to /etc/hostname.
      PREVIOUS_HOSTNAME=$(hostname)

      SERIAL=$(dmidecode -s system-serial-number 2>/dev/null | tr -d '[:space:]')

      if [ -z "$SERIAL" ] || [ "$SERIAL" = "ToBeFilledByO.E.M." ] || [ "$SERIAL" = "Default string" ]; then
        RANDOM_SUFFIX=$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 4)
        CORRECT_HOSTNAME="LT-L-UNKWN-${RANDOM_SUFFIX}"
      else
        CORRECT_HOSTNAME="LT-L-${SERIAL}"
      fi

      hostnamectl set-hostname "$CORRECT_HOSTNAME"

      # Patch /etc/hosts to match, same as the install-time script did
      if grep -q "127.0.1.1" /etc/hosts; then
        sed -i "s/^127\.0\.1\.1.*/127.0.1.1\t${CORRECT_HOSTNAME}/" /etc/hosts
      else
        echo "127.0.1.1\t${CORRECT_HOSTNAME}" >> /etc/hosts
      fi

      # previous_hostname shows what gnome-initial-setup (or anything else)
      # had already changed it to before this pass corrected it - the key
      # thing to check if hostname issues come up again in the future.
      echo "$(date '+%Y-%m-%d %H:%M:%S') [HOSTNAME-PASS2] previous_hostname=${PREVIOUS_HOSTNAME} corrected_to=${CORRECT_HOSTNAME}" >> "$LOGFILE"

      # Read new password from stdin (piped from UI script)
      read -r NEW_PASS

      # Resolve the LUKS backing device
      LUKS_DEV=$(lsblk -rno NAME,TYPE | awk '$2=="crypt"{print $1}' | head -1)
      DEVICE=$(cryptsetup status "$LUKS_DEV" 2>/dev/null | awk '/device:/{print $2}')

      if [ -z "$DEVICE" ]; then
        echo "$(date '+%Y-%m-%d %H:%M:%S') [LUKS-ROOT] ERROR could not determine LUKS device" >> "$LOGFILE"
        echo "ERROR: Could not determine LUKS device" >&2
        exit 1
      fi

      echo "$(date '+%Y-%m-%d %H:%M:%S') [LUKS-ROOT] resolved device=${DEVICE}, attempting key change" >> "$LOGFILE"

      # Change the LUKS key: use printf '%s' to avoid trailing newline on both
      # the old key (stdin) and new key (process substitution) - echo appends \n
      # which gets stored as part of the key, causing boot-time password mismatch.
      printf '%s' "ubuntu" | cryptsetup luksChangeKey "$DEVICE" <(printf '%s' "$NEW_PASS")
      LUKS_RESULT=$?

      echo "$(date '+%Y-%m-%d %H:%M:%S') [LUKS-ROOT] cryptsetup exit_code=${LUKS_RESULT}" >> "$LOGFILE"

      if [ $LUKS_RESULT -eq 0 ]; then
        rm -f /var/lib/luks-firstboot
        exit 0
      else
        exit 1
      fi
      SCRIPT

    - chmod 0700 /target/usr/local/bin/luks-change-password-root.sh

    # Sudoers rule - NOPASSWD only for this specific script, nothing else
    - |
      cat > /target/etc/sudoers.d/luks-change-password << 'EOF'
      ALL ALL=(root) NOPASSWD: /usr/local/bin/luks-change-password-root.sh
      EOF

    - chmod 0440 /target/etc/sudoers.d/luks-change-password

    # Autostart desktop entry - triggers on first GUI login for any user
    - mkdir -p /target/etc/xdg/autostart

    - |
      cat > /target/etc/xdg/autostart/luks-change-password.desktop << 'EOF'
      [Desktop Entry]
      Type=Application
      Name=Axelera AI - Disk Encryption Setup
      Comment=Set permanent LUKS encryption password on first login
      Exec=/usr/local/bin/luks-change-password-ui.sh
      X-GNOME-Autostart-enabled=true
      X-GNOME-Autostart-Delay=5
      NotifyStartup=false
      EOF

    # Marker file - removed by root script on success
    - touch /target/var/lib/luks-firstboot

    ###########################################################################
    # End - LUKS first-boot password-change (GUI, post-login) ─────────────────
    ###########################################################################

    ###########################################################################
    # Start - Axelera branding ────────────────────────────────────────────────
    ###########################################################################
    #
    # 1. Company wallpaper via dconf system-wide default, with a solid black
    #    fallback if the download fails for any reason
    # 2. GDM login screen - banner text plus matching background
    # 3. dconf profile applied system-wide so it affects all user sessions,
    #    plus GDM's own separate profile for the login screen
    #
    # picture-options is set to 'zoom' - fills the screen completely with no
    # distortion and no colored bars, regardless of exact screen resolution,
    # which matters since this deploys across laptops with varying panel
    # sizes. This is also GNOME's own default behaviour when a wallpaper is
    # set via Settings.

    # -- Download the wallpaper ──────────────────────────────────────────────
    # This runs via `curtin in-target` (chrooted into the target filesystem),
    # not directly in the live installer environment - curl is only
    # guaranteed to exist on the target (it's in packages: above), not
    # necessarily in the live ISO's own environment. Paths inside the script
    # below are written as they appear from inside the chroot (no /target
    # prefix needed).
    #
    # The result is validated with `file`, not just curl's exit code, since
    # some URLs can return a 200 OK with an HTML page instead of a real
    # error - checking the actual downloaded file type catches that too.
    - mkdir -p /target/usr/share/backgrounds
    - |
      cat > /target/tmp/download-wallpaper.sh << 'SCRIPT'
      #!/bin/bash
      WALLPAPER_URL="https://storage.4me.com/media/50553/2025/04/24/6560642/1745513519.5503378-c89906ec05ebf464545e9c45a0a66e8b03abebc84f68db7a571a3c4fbb992de9/NEW-Wallpaper-Desktop.jpg"
      WALLPAPER_PATH="/usr/share/backgrounds/axelera-wallpaper.jpg"
      LOG="/var/log/axelera-provisioning.log"

      curl -sSL -f --retry 5 --retry-delay 3 --retry-all-errors -o "$WALLPAPER_PATH" "$WALLPAPER_URL"
      CURL_EXIT=$?
      echo "$(date '+%Y-%m-%d %H:%M:%S') [BRANDING] curl exit_code=${CURL_EXIT}" >> "$LOG"

      if [ $CURL_EXIT -eq 0 ] && [ -f "$WALLPAPER_PATH" ]; then
        FILESIZE=$(stat -c%s "$WALLPAPER_PATH" 2>/dev/null || echo 0)
        FILETYPE=$(file -b "$WALLPAPER_PATH" 2>/dev/null)
        echo "$(date '+%Y-%m-%d %H:%M:%S') [BRANDING] downloaded file size=${FILESIZE} bytes, type=${FILETYPE}" >> "$LOG"

        if [ "$FILESIZE" -gt 0 ] && echo "$FILETYPE" | grep -qi "image"; then
          echo "$(date '+%Y-%m-%d %H:%M:%S') [BRANDING] wallpaper downloaded successfully" >> "$LOG"
          touch /var/lib/axelera-wallpaper-ok
        else
          echo "$(date '+%Y-%m-%d %H:%M:%S') [BRANDING] WARNING downloaded file failed validation (size or type), falling back to solid black" >> "$LOG"
          rm -f "$WALLPAPER_PATH"
        fi
      else
        echo "$(date '+%Y-%m-%d %H:%M:%S') [BRANDING] WARNING curl failed (exit ${CURL_EXIT}), falling back to solid black" >> "$LOG"
        rm -f "$WALLPAPER_PATH"
      fi
      SCRIPT

    - curtin in-target --target=/target -- bash /tmp/download-wallpaper.sh
    - rm -f /target/tmp/download-wallpaper.sh

    # -- dconf profile: applies defaults for all users ─────────────────────
    - mkdir -p /target/etc/dconf/profile
    - |
      cat > /target/etc/dconf/profile/user << 'EOF'
      user-db:user
      system-db:local
      EOF

    # -- dconf system-wide defaults: wallpaper (or black fallback) ──────────
    - mkdir -p /target/etc/dconf/db/local.d
    - |
      if [ -f /target/var/lib/axelera-wallpaper-ok ]; then
        cat > /target/etc/dconf/db/local.d/01-axelera-branding << 'EOF'
      [org/gnome/desktop/background]
      picture-uri='file:///usr/share/backgrounds/axelera-wallpaper.jpg'
      picture-uri-dark='file:///usr/share/backgrounds/axelera-wallpaper.jpg'
      picture-options='zoom'
      primary-color='#000000'
      secondary-color='#000000'

      [org/gnome/desktop/screensaver]
      picture-uri='file:///usr/share/backgrounds/axelera-wallpaper.jpg'
      picture-options='zoom'
      primary-color='#000000'
      EOF
      else
        cat > /target/etc/dconf/db/local.d/01-axelera-branding << 'EOF'
      [org/gnome/desktop/background]
      picture-uri=''
      picture-uri-dark=''
      primary-color='#000000'
      secondary-color='#000000'
      color-shading-type='solid'
      picture-options='none'

      [org/gnome/desktop/screensaver]
      picture-uri=''
      primary-color='#000000'
      color-shading-type='solid'
      picture-options='none'
      EOF
      fi

    # -- Compile the dconf database so changes take effect ──────────────────
    - curtin in-target --target=/target -- dconf update

    # -- GDM login screen: set org name visible on the login screen ─────────
    # WelcomeMessage appears on the GDM greeter under the logo area.
    # AutomaticLogin is intentionally left disabled for security.
    - |
      cat > /target/etc/gdm3/custom.conf << 'EOF'
      [daemon]
      # AutomaticLoginEnable = false

      [security]

      [xdmcp]

      [chooser]

      [debug]
      # Uncomment to enable GDM debugging
      # Enable=true
      EOF

    # -- Set GDM greeter message via AccountsService (shows on login screen) -
    - mkdir -p /target/etc/AccountsService
    - |
      cat > /target/usr/share/gnome-shell/extensions/README-axelera << 'EOF'
      Axelera AI managed device.
      Contact IT: it@axelera.ai
      EOF

    # Greeter branding - sets the text shown below the user avatar on GDM,
    # plus the actual visible background behind the login form. This is a
    # separate dconf database from the user profile above (GDM has its own),
    # so it needs its own background keys set - otherwise the login screen
    # would still show GNOME's stock default background even though the
    # desktop and lock screen are branded.
    #
    # disable-user-list is intentionally left unset - enabling it hides the
    # account picker on the GDM greeter, requiring users to type their
    # username blind, which is not the desired experience here.
    - mkdir -p /target/etc/dconf/db/gdm.d
    - |
      if [ -f /target/var/lib/axelera-wallpaper-ok ]; then
        cat > /target/etc/dconf/db/gdm.d/01-axelera-login << 'EOF'
      [org/gnome/login-screen]
      banner-message-enable=true
      banner-message-text='Axelera AI - Managed Device\nUnauthorised access is prohibited.'

      [org/gnome/desktop/background]
      picture-uri='file:///usr/share/backgrounds/axelera-wallpaper.jpg'
      picture-options='zoom'
      primary-color='#000000'
      secondary-color='#000000'
      EOF
      else
        cat > /target/etc/dconf/db/gdm.d/01-axelera-login << 'EOF'
      [org/gnome/login-screen]
      banner-message-enable=true
      banner-message-text='Axelera AI - Managed Device\nUnauthorised access is prohibited.'

      [org/gnome/desktop/background]
      picture-uri=''
      primary-color='#000000'
      secondary-color='#000000'
      color-shading-type='solid'
      picture-options='none'
      EOF
      fi

      # Marker file is only ever consumed here, after both the user profile
      # and the GDM profile have had a chance to check it.
      rm -f /target/var/lib/axelera-wallpaper-ok

    # Compile GDM dconf database
    - |
      cat > /target/etc/dconf/profile/gdm << 'EOF'
      user-db:user
      system-db:gdm
      EOF

    - curtin in-target --target=/target -- dconf update

    ###########################################################################
    # End - Axelera branding ──────────────────────────────────────────────────
    ###########################################################################

    # -- Disable Ubuntu telemetry prompt ─────────────────────────────────────
    - curtin in-target --target=/target -- ubuntu-report send no

    # -- GNOME initial setup wizard - partial skip ────────────────────────────
    # account-creation is intentionally NOT in the skip list - the wizard will
    # present only the account creation step on first boot, letting the user
    # create their own local admin account (standard sudo, password required).
    # All other pages (language, keyboard, privacy, ubuntu-pro etc.) are skipped
    # to avoid noise on a managed device.
    - mkdir -p /target/etc/gnome-initial-setup
    - curtin in-target --target=/target -- sh -c 'echo "[pages]" > /etc/gnome-initial-setup/vendor.conf'
    - curtin in-target --target=/target -- sh -c 'echo "skip=language;keyboard;privacy;software;parental-controls;ubuntu-pro" >> /etc/gnome-initial-setup/vendor.conf'
    - curtin in-target --target=/target -- systemctl mask ubuntu-advantage-desktop-daemon

    # Also disable Ubuntu Pro background notifications (apt_news, MOTD ads)
    - curtin in-target --target=/target -- pro config set apt_news=false

    # -- Install Microsoft Intune Portal + Edge ───────────────────────────────
    # Filename AND keyring name ("microsoft-prod.list" / "microsoft-prod.gpg")
    # are set to exactly match what microsoft-identity-broker (a dependency
    # pulled in automatically by intune-portal) creates on its own. Matching
    # this exactly means our bootstrap file and whatever
    # microsoft-identity-broker writes are the same file - no duplicate
    # source entry, no possible Signed-By mismatch between them.
    - curtin in-target --target=/target -- mkdir -p /tmp/microsoft
    - curtin in-target --target=/target -- sh -c 'curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /tmp/microsoft/microsoft-prod.gpg'
    - curtin in-target --target=/target -- install -o root -g root -m 644 /tmp/microsoft/microsoft-prod.gpg /usr/share/keyrings/microsoft-prod.gpg

    - curtin in-target --target=/target -- sh -c 'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" > /etc/apt/sources.list.d/microsoft-prod.list'

    # Edge repo - kept as our own bootstrap entry since it is required for the
    # very first "apt-get install microsoft-edge-stable" to succeed at all.
    # Note: microsoft-edge-stable additionally self-manages a separate file
    # (/etc/apt/sources.list.d/microsoft-edge.sources) with a different URL
    # (packages.microsoft.com/repos/edge-stable, not /repos/edge) and a
    # different keyring (microsoft-edge.gpg). This does not trigger a
    # Signed-By conflict since apt only conflicts on matching URLs, and
    # these are different URLs - flagging here so it isn't a surprise if
    # this changes in a future Edge package update.
    - curtin in-target --target=/target -- sh -c 'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge.list'

    - curtin in-target --target=/target -- apt-get update
    - curtin in-target --target=/target -- apt-get install -y intune-portal microsoft-edge-stable

    - rm -f /target/etc/apt/sources.list.d/microsoft-edge-dev.list
    - rm -f /target/etc/apt/trusted.gpg.d/microsoft.gpg
    - curtin in-target --target=/target -- rm -rf /tmp/microsoft

    # Remove bloatware
    - curtin in-target --target=/target -- apt-get purge -y libreoffice* remmina* transmission*

    # -- needrestart: set to automatic mode ──────────────────────────────────
    # By default needrestart prompts interactively when services need restarting
    # after an apt operation. This blocks silent Intune-deployed scripts that
    # install packages. Setting mode to 'a' (automatic) makes it restart
    # services silently without prompting - correct behaviour for a managed
    # device where scripts run unattended.
    # kernelhints is disabled separately - kernel upgrade prompts are handled
    # by your update policy, not by the installer daemon.
    - mkdir -p /target/etc/needrestart/conf.d
    - |
      cat > /target/etc/needrestart/conf.d/99-intune.conf << 'EOF'
      # Managed by Axelera autoinstall - do not edit manually
      $nrconf{restart} = 'a';
      $nrconf{kernelhints} = 0;
      EOF

    # Clean up
    - curtin in-target --target=/target -- apt-get autoremove -y
    - curtin in-target --target=/target -- apt-get clean
